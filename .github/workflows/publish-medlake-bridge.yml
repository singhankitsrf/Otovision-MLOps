name: Publish MedLake Static Space

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-medlake-bridge.yml"

permissions:
  contents: read

jobs:
  publish-medlake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hub dependency
        run: pip install huggingface_hub==1.30.0
      - name: Fetch the validated MedLake static bundle
        run: |
          mkdir -p /tmp/medlake
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/singhankitsrf/MedLake-Azure-PySpark/main/hf_static/README.md -o /tmp/medlake/README.md
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/singhankitsrf/MedLake-Azure-PySpark/main/hf_static/index.html -o /tmp/medlake/index.html
      - name: Smoke-test static application
        run: |
          python -m http.server 8000 --directory /tmp/medlake >/tmp/medlake-static.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8000/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/medlake-static.log
          exit 1
      - name: Publish MedLake to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "HF_TOKEN is not configured in this authorized bridge repository"; exit 1; }
          python scripts/publish_static_space.py --repo-id singhankit491/medlake-pyspark --folder /tmp/medlake
