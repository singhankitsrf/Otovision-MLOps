name: Publish LW Portfolio Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-lw-space.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'huggingface_hub>=0.34'
      - name: Publish static portfolio
        run: |
          cat > /tmp/publish_lw.py <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          owner = "singhankit491"
          repo_id = f"{owner}/lw-telemedicine-product"
          api = HfApi(token=os.environ["HF_TOKEN"])
          if api.whoami().get("name") != owner:
              raise SystemExit("Unexpected Hugging Face identity")

          out = Path("/tmp/lw-space")
          out.mkdir(parents=True, exist_ok=True)
          readme = "---\ntitle: LW Telemedicine Product\nemoji: 🩺\ncolorFrom: green\ncolorTo: blue\nsdk: static\npinned: true\ntags:\n- digital-health\n- telemedicine\n- product-engineering\n- workflow-systems\n---\n\n# LW Telemedicine Product\n\nRecruiter-facing engineering surface for a live digital-health consultation product.\n\nGitHub engineering documentation: https://github.com/singhankitsrf/singhankitsrf/tree/main/projects/telemedicine-platform\n\nThe portfolio emphasizes workflow architecture, scheduling, role-aware access, browser communication, operational administration, and explicit evidence boundaries.\n\nThis Space documents product engineering evidence. It does not claim independent security certification, regulatory approval, or hospital-scale service-level performance without separate evidence.\n"
          index = "<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>LW Telemedicine Product</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:48px 24px;background:#f8fafc;color:#0f172a}.hero,.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}a{color:#0f766e}</style></head><body><div class='hero'><h1>LW Telemedicine Product</h1><p>Digital-health product engineering portfolio focused on a stateful consultation journey and operational workflow.</p><p><a href='https://github.com/singhankitsrf/singhankitsrf/tree/main/projects/telemedicine-platform'>View engineering documentation</a></p></div><div class='grid'><div class='card'><h3>Access</h3><p>Role-aware user journeys and controlled clinician onboarding.</p></div><div class='card'><h3>Scheduling</h3><p>Structured appointment-window management.</p></div><div class='card'><h3>Consultation</h3><p>Browser communication integrated into the product journey.</p></div><div class='card'><h3>Operations</h3><p>Administrative visibility and state-oriented workflow management.</p></div></div><p>Evidence boundary: no independent security, regulatory, or hospital-scale SLA certification is claimed here.</p></body></html>"
          (out / "README.md").write_text(readme)
          (out / "index.html").write_text(index)
          api.create_repo(repo_id=repo_id, repo_type="space", space_sdk="static", private=False, exist_ok=True)
          api.upload_folder(repo_id=repo_id, repo_type="space", folder_path=str(out), commit_message="Publish LW portfolio surface")
          print(f"https://huggingface.co/spaces/{repo_id}")
          PY
          python /tmp/publish_lw.py
