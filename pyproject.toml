[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otovision-mlops"
version = "0.1.0"
description = "Production-oriented otoscopic image classification and MLOps portfolio project."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ankit Kumar Singh"}]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
